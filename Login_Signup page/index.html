<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AuthFlow | Login & Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-container" id="authContainer">
            <!-- Decorative shapes -->
            <div class="bg-shape shape-1"></div>
            <div class="bg-shape shape-2"></div>

            <!-- LOGIN FORM -->
            <div class="form-panel login-panel" id="loginPanel">
                <div class="brand">
                    <div class="logo-circle">A</div>
                    <h2>Welcome back</h2>
                    <p>Sign in to continue to your account</p>
                </div>

                <form id="loginForm" novalidate>
                    <div class="input-group">
                        <label for="loginEmail">Email address</label>
                        <input type="email" id="loginEmail" name="email" placeholder="hello@example.com" autocomplete="email">
                        <div class="error-msg" id="loginEmailError"></div>
                    </div>
                    <div class="input-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="loginPassword" name="password" placeholder="••••••••" autocomplete="current-password">
                            <button type="button" class="toggle-password" data-target="loginPassword">
                                <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <div class="error-msg" id="loginPasswordError"></div>
                    </div>
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe"> <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary" id="loginBtn">Log In</button>
                </form>

                <div class="switch-prompt">
                    <p>Don't have an account? <button type="button" class="switch-btn" id="showSignupBtn">Create account</button></p>
                </div>
            </div>

            <!-- SIGNUP FORM -->
            <div class="form-panel signup-panel hidden" id="signupPanel">
                <div class="brand">
                    <div class="logo-circle">A</div>
                    <h2>Create account</h2>
                    <p>Join us and start your journey</p>
                </div>

                <form id="signupForm" novalidate>
                    <div class="input-group">
                        <label for="signupName">Full name</label>
                        <input type="text" id="signupName" name="fullname" placeholder="Sadia Tabassum " autocomplete="name">
                        <div class="error-msg" id="signupNameError"></div>
                    </div>
                    <div class="input-group">
                        <label for="signupEmail">Email address</label>
                        <input type="email" id="signupEmail" name="email" placeholder="hello@example.com" autocomplete="email">
                        <div class="error-msg" id="signupEmailError"></div>
                    </div>
                    <div class="input-group">
                        <label for="signupPassword">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signupPassword" name="password" placeholder="Create a strong password" autocomplete="new-password">
                            <button type="button" class="toggle-password" data-target="signupPassword">
                                <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <div class="error-msg" id="signupPasswordError"></div>
                        <div class="password-strength" id="passwordStrength"></div>
                    </div>
                    <div class="input-group">
                        <label for="signupConfirm">Confirm password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signupConfirm" name="confirm" placeholder="Confirm your password">
                            <button type="button" class="toggle-password" data-target="signupConfirm">
                                <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <div class="error-msg" id="signupConfirmError"></div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="signupBtn">Sign Up</button>
                </form>

                <div class="switch-prompt">
                    <p>Already have an account? <button type="button" class="switch-btn" id="showLoginBtn">Log in</button></p>
                </div>
            </div>
        </div>

        <!-- Toast notification -->
        <div id="toastMessage" class="toast-message hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
