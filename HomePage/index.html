<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamSpace | Media Gallery Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="glass-header">
    <div class="container header-inner">
        <div class="logo">
            <div class="logo-icon"><span>✨</span></div>
            <h1>DreamSpace</h1>
        </div>
        <div class="nav-buttons">
            <button class="btn-outline-sm" id="clearAllBtn">Clear all</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="hero">
        <h2>Your visual diary 🎨</h2>
        <p>Add videos & photos — watch your collection glow</p>
    </div>

    <!-- ADD MEDIA SECTION -->
    <div class="add-media-card">
        <div class="form-title">
            <span>📸</span> 
            <span>Add new memory</span>
        </div>
        <div class="input-group-row">
            <div class="input-flex">
                <label>Title / Caption</label>
                <input type="text" id="mediaTitle" placeholder="Sunset beach, concert, fun moment...">
            </div>
            <div class="input-flex">
                <label>Media URL (image or video link)</label>
                <input type="text" id="mediaUrl" placeholder="https://....jpg / .mp4 / .png">
            </div>
        </div>

        <div class="input-group-row">
            <div class="input-flex">
                <label>Media Type</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="mediaType" value="photo" checked> 🖼️ Photo
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="mediaType" value="video"> 🎬 Video
                    </label>
                </div>
            </div>
            <div class="input-flex">
                <label>&nbsp;</label>
                <button class="btn-primary-glow" id="addMediaBtn">+ Add to gallery</button>
            </div>
        </div>
        <p style="font-size: 12px; color: #6c757d; margin-top: 8px;">✨ Tip: Use free image URLs (Unsplash, Pexels) or direct video links (MP4).</p>
    </div>

    <!-- GALLERY HEADER + FILTER -->
    <div class="gallery-header">
        <h3><span>🌈</span> My Gallery</h3>
        <div class="filter-buttons">
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="photo">Photos</button>
            <button class="filter-chip" data-filter="video">Videos</button>
        </div>
    </div>

    <!-- DYNAMIC GRID -->
    <div id="mediaGrid" class="media-grid"></div>
</div>

<footer>
    <p>✨ DreamSpace — curate your favorites with style</p>
</footer>

<script src="script.js"></script>
</body>
</html>
